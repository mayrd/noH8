name: Test Build Release 

# Builds the browser extension and publishes GitHub Releases containing
# ready-to-install packages for Chromium-based browsers (Chrome, Edge, Brave,
# Opera, ...) and Firefox.
#
# CI/CD — tests run first and build & release only proceed on success
# (`release` job has `needs: test` + is skipped on PRs):
#   * pull request to `main` -> runs the test suite only (CI gate before merge)
#   * push to `main` -> tests pass, then builds packages and publishes a
#     "latest" GitHub Release (pre-release, overwriting previous latest)
#   * version tag `vX.Y.Z` -> tests pass, then builds and publishes a
#     permanent, versioned GitHub Release.
#   * manual dispatch -> tests pass, then builds and publishes a
#     "latest" GitHub Release (pre-release, overwriting previous latest)
on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

  release:
    name: Build & package for browsers
    needs: test
    # Skip build & release on pull requests — only run tests as a CI gate.
    # Build & release only happen on push to main, version tags, or manual dispatch.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build extension (Chrome MV3)
        run: npm run build

      - name: Read extension version
        id: version
        run: echo "EXT_VERSION=$(node -p "require('./dist/manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Package for Chromium (zip)
        run: |
          mkdir -p releases
          (cd dist && zip -r "../releases/noH8-${{ steps.version.outputs.EXT_VERSION }}-chromium.zip" .)

      - name: Prepare Firefox package
        run: npm run package:firefox

      - name: Package for Firefox (xpi)
        run: |
          (cd dist-firefox && zip -r "../releases/noH8-${{ steps.version.outputs.EXT_VERSION }}-firefox.xpi" .)

      - name: List packages
        run: ls -lh releases

      - name: Upload packages as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: browser-packages
          path: releases/*

      # For a pushed version tag (vX.Y.Z), publish a permanent GitHub Release.
      - name: Publish versioned GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" releases/* --generate-notes

      # For push to main or manual dispatch, publish/update a "latest" pre-release.
      - name: Publish latest pre-release
        if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Delete the previous "latest" release if it exists
          gh release delete latest --yes || true
          # Create a new "latest" pre-release
          gh release create latest releases/* --prerelease --title "Latest Build" --generate-notes